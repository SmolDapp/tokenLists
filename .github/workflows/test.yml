name: 🧪 CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GoSetup
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: NodeSetup
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Verify
        run: npm run verify
